# Typecheck and tests on every push and pull request.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # release.yml runs the same checks before it builds
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2" # keep in step with ARG BUN_VERSION in the Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test
